# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format
[versions]
agp = "9.3.1"
kotlin = "2.4.10"

kotlinxCoroutines = "1.11.0"
annotation = "1.10.0"
coreKtx = "1.19.0"

webkit = "1.16.0"
webgpu = "1.0.0-alpha05"
coil = "2.7.0"

mtDataFilesProvider = "1.0.0"

hiddenapibypassVersion = "6.1"
nayukiQR = "1.8.0"
libsuVersion = "6.0.0"
lifecycle = "2.11.0"

material3 = "1.5.0-alpha24"

kadb = "2.1.3"
zxing = "3.5.4"
annotationExperimental = "1.6.0"

compose-bom = "2026.06.01"
activity-compose = "1.13.0"

[libraries]
# AndroidX 核心基础库
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-annotation-experimental = { group = "androidx.annotation", name = "annotation-experimental", version.ref = "annotationExperimental" }

# Web 新API
androidx-webgpu = { group = "androidx.webgpu", name = "webgpu", version.ref = "webgpu" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Lifecycle 组件
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-reactivestreams-ktx = { group = "androidx.lifecycle", name = "lifecycle-reactivestreams-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }

# kotlinx 协程
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core-jvm = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core-jvm", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# MT 文件提供者
mt-dataFilesProvider = { group = "com.github.L-JINBIN", name = "MTDataFilesProvider", version.ref = "mtDataFilesProvider" }

lsposed-hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypassVersion" }

nayuki-qrcode = { group = "io.nayuki", name = "qrcodegen", version.ref = "nayukiQR" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsuVersion" }
libsu-service = { module = "com.github.topjohnwu.libsu:service", version.ref = "libsuVersion" }
libsu-io = { module = "com.github.topjohnwu.libsu:io", version.ref = "libsuVersion" }

com-flyfishxu-kadb = { group = "com.flyfishxu", name = "kadb", version.ref = "kadb" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation"}
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout"}
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation"}
androidx-compose-animation-core = { group = "androidx.compose.animation", name = "animation-core"}
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }

[bundles]
# 捆绑式引入
compose = [
    "androidx-compose-ui",
    "androidx-ui-graphics",
    "androidx-compose-material-icons-extended",
    "androidx-compose-material3",
    "androidx-activity-compose",
    "androidx-compose-foundation",
    "androidx-compose-foundation-layout",
    "androidx-compose-animation",
    "androidx-compose-animation-core"
]
compose-lifecycle = [
    "androidx-lifecycle-livedata-ktx",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-process",
    "androidx-lifecycle-reactivestreams-ktx",
    "androidx-lifecycle-service"
]
compose-debug = [
    "androidx-compose-ui-tooling",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-ui-test-manifest"
]
coroutines-runtime = [
    "kotlinx-coroutines-core-jvm",
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android"
]
libsu = [
    "libsu-core",
    "libsu-service",
    "libsu-io"
]

[plugins]
# 插件定义
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
