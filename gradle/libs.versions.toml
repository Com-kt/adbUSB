# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format
[versions]
agp = "8.13.2"
kotlin = "2.3.21"

kotlinxCoroutines = "1.10.2"
constraintlayout = "2.2.1"
appcompat = "1.7.1"
material = "1.13.0"
annotation = "1.10.0"
coreKtx = "1.18.0"
activityKtx = "1.13.0"

bouncycastle = "1.78"
mtDataFilesProvider = "1.0.0"

hiddenapibypassVersion = "6.1"
nayukiQR = "1.8.0"
libsuVersion = "6.0.0"

[libraries]
# AndroidX 核心基础库
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }

# Google & 第三方库
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core-jvm = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core-jvm", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# BouncyCastle 库
bcpkix-jdk18on = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
bcprov-jdk18on = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bctls-jdk18on = { group = "org.bouncycastle", name = "bctls-jdk18on", version.ref = "bouncycastle" }

# MT 文件提供者
mt-dataFilesProvider = { group = "com.github.L-JINBIN", name = "MTDataFilesProvider", version.ref = "mtDataFilesProvider" }

lsposed-hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypassVersion" }

nayuki-qrcode = { group = "io.nayuki", name = "qrcodegen", version.ref = "nayukiQR" }

libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsuVersion" }
libsu-service = { module = "com.github.topjohnwu.libsu:service", version.ref = "libsuVersion" }
libsu-io = { module = "com.github.topjohnwu.libsu:io", version.ref = "libsuVersion" }

[bundles]
# 捆绑式引入
coroutines-runtime = [
    "kotlinx-coroutines-core-jvm",
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android"
]
bouncycastle = [
    "bcprov-jdk18on", 
    "bcpkix-jdk18on",
    "bctls-jdk18on"
]
libsu = [
    "libsu-core",
    "libsu-service",
    "libsu-io"
]

[plugins]
# 插件定义
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
