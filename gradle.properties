#AndroidIDE: enforce UTF-8 & locale for Gradle daemon
#Sun Apr 05 05:50:04 GMT 2026
android.enableAppCompileTimeRClass=true
android.enableResourceOptimizations=false
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.incremental.native=true
# 初始化 150MB JVM内存堆足以够用，最大先设置 3.9GB JVM内存堆，后续看 flash fastboot
org.gradle.jvmargs=-Xms150M -Xmx3900m -Dfile.encoding\=UTF-8
android.enableLegacyVariantApi=true
android.suppressUnsupportedCompileSdk=37.0