name: Android Compose CI

on:
  push:
    branches: [ "compose" ]
  pull_request:
    branches: [ "compose" ]

permissions:
  contents: write
  
jobs:
  build:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.3.3'

      - name: Check CMake Version
        run: cmake --version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > release.jks

      - name: Build Debug and Release
        run: ./gradlew :app:lint :app:assembleDebug :app:assembleRelease -i -w --stacktrace --warning-mode all 2>&1 | tee build.log
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          
      - name: Upload Build Log
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          archive: false
          
      - name: Upload Lint Report HTML
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-html
          path: app/build/reports/lint-results-debug.html
          archive: false
          
      - name: Upload Lint Report
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/*
          archive: true
        
      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*
          archive: true

      - name: Upload Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: app/build/outputs/apk/release/*
          archive: true
          
      - name: Upload Native Debug Symbols
        uses: actions/upload-artifact@v7
        with:
          name: native-debug-symbols
          path: app/build/outputs/native-debug-symbols/*
          archive: true
          
      - name: Upload Apks Logs
        uses: actions/upload-artifact@v7
        with:
          name: apks-logs
          path: app/build/outputs/logs/*
          archive: true
         
      - name: Upload R8
        uses: actions/upload-artifact@v7
        with:
          name: r8-logs
          path: app/build/outputs/mapping/release/*
          archive: true
          
      - name: Upload R8 HTML
        uses: actions/upload-artifact@v7
        with:
          name: r8-html
          path: app/build/outputs/mapping/release/configanalyzer.html
          archive: false
          