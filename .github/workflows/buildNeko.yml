name: Android CI

on:
  push:
    branches: [ "neko" ]
  pull_request:
    branches: [ "neko" ]

permissions:
  contents: write
  
jobs:
  build:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Setup Vulkan SDK (glslc)
        uses: humbletim/setup-vulkan-sdk@v1
        with:
          vulkan-query-version: 'latest'
          vulkan-components: Glslc

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.3.3'

      - name: Check CMake Version
        run: cmake --version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Both Keystores
        run: |
          echo "${{ secrets.OLD_SIGNING_KEY_BASE64 }}" | base64 --decode > app/old_key.jks
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > app/new_full_ec_key.jks
          echo "${{ secrets.LINEAGE_BASE64 }}" | base64 --decode > app/app_lineage.bin

      - name: Build Debug, Release and Bundle
        run: ./gradlew :app:lint :app:assembleDebug :app:assembleRelease :app:bundleDebug :app:bundleRelease -i -w --stacktrace --warning-mode all 2>&1 | tee build.log
        env:
          OLD_STORE_PASSWORD: ${{ secrets.OLD_KEY_STORE_PASSWORD }}
          OLD_KEY_ALIAS: ${{ secrets.OLD_KEY_ALIAS }}
          OLD_KEY_PASSWORD: ${{ secrets.OLD_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      
      - name: Builds APKs Splits & Sign with V3.1 Key Rotation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo google/bundletool --pattern "bundletool-all-*.jar" --clobber
          mv bundletool-all-*.jar bundletool.jar
    
          RELEASE_AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          DEBUG_AAB=$(ls app/build/outputs/bundle/debug/*.aab | head -n 1)
          AAPT2_PATH=$(ls -d $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          echo "Found GitHub Actions AAPT2 at: $AAPT2_PATH"
    
          echo "=== Release AAB: $RELEASE_AAB ==="
          echo "=== Debug AAB: $DEBUG_AAB ==="
    
          java -jar bundletool.jar build-apks \
            --bundle="$RELEASE_AAB" \
            --output=app/build/outputs/bundle/release/aab-release.apks \
            --aapt2="$AAPT2_PATH" \
            --mode=default \
            --ks=app/new_full_ec_key.jks \
            --ks-pass=pass:${{ secrets.KEY_STORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.KEY_ALIAS }} \
            --key-pass=pass:${{ secrets.KEY_PASSWORD }}
      
          java -jar bundletool.jar build-apks \
            --bundle="$DEBUG_AAB" \
            --output=app/build/outputs/bundle/debug/aab-debug.apks \
            --aapt2="$AAPT2_PATH" \
            --mode=default \
            --ks=app/new_full_ec_key.jks \
            --ks-pass=pass:${{ secrets.KEY_STORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.KEY_ALIAS }} \
            --key-pass=pass:${{ secrets.KEY_PASSWORD }}

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using system apksigner: $APKSIGNER"
          echo "=== Re-signing Release Split APKs with V3.1 ==="
          mkdir -p ext_release
          unzip -o app/build/outputs/bundle/release/aab-release.apks -d ext_release
          find ext_release -name "*.apk" | while read -r apk; do
            echo "Processing: $apk"
            "$APKSIGNER" sign \
              --v1-signing-enabled false \
              --v2-signing-enabled false \
              --ks app/old_key.jks \
              --ks-pass "pass:${{ secrets.OLD_KEY_STORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.OLD_KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.OLD_KEY_PASSWORD }}" \
              --next-signer \
              --ks app/new_full_ec_key.jks \
              --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --lineage app/app_lineage.bin \
              "$apk"
          done
    
          cd ext_release && zip -r ../app/build/outputs/bundle/release/aab-release.apks . && cd ..
          echo "=== Re-signing Debug Split APKs with V3.1 ==="
          mkdir -p ext_debug
          unzip -o app/build/outputs/bundle/debug/aab-debug.apks -d ext_debug
          find ext_debug -name "*.apk" | while read -r apk; do
            echo "Processing: $apk"
            "$APKSIGNER" sign \
              --v1-signing-enabled false \
              --v2-signing-enabled false \
              --ks app/old_key.jks \
              --ks-pass "pass:${{ secrets.OLD_KEY_STORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.OLD_KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.OLD_KEY_PASSWORD }}" \
              --next-signer \
              --ks app/new_full_ec_key.jks \
              --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --lineage app/app_lineage.bin \
              "$apk"
          done
    
          cd ext_debug && zip -r ../app/build/outputs/bundle/debug/aab-debug.apks . && cd ..
          echo "=== V3.1 Key Rotation signing completed successfully! ==="

      - name: Upload Build Log
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          archive: false
          
      - name: Upload Lint Report HTML
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-html
          path: app/build/reports/lint-results-debug.html
          archive: false
          
      - name: Upload Lint Report
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/*
          archive: true
        
      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*
          archive: true

      - name: Upload Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: app/build/outputs/apk/release/*
          archive: true
          
      - name: Upload Native Debug Symbols
        uses: actions/upload-artifact@v7
        with:
          name: native-debug-symbols
          path: app/build/outputs/native-debug-symbols/*
          archive: true
          
      - name: Upload Apks Logs
        uses: actions/upload-artifact@v7
        with:
          name: apks-logs
          path: app/build/outputs/logs/*
          archive: true
         
      - name: Upload R8
        uses: actions/upload-artifact@v7
        with:
          name: r8-logs
          path: app/build/outputs/mapping/release/*
          archive: true
          
      - name: Upload R8 HTML
        uses: actions/upload-artifact@v7
        with:
          name: r8-html
          path: app/build/outputs/mapping/release/configanalyzer.html
          archive: false
          
      - name: Upload Bundle
        uses: actions/upload-artifact@v7
        with:
          name: aab-bundle
          path: app/build/outputs/bundle/*
          archive: true