name: Android CI

on:
  push:
    branches: [ "neko" ]
  pull_request:
    branches: [ "neko" ]

permissions:
  contents: write
  
jobs:
  build:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.2'

      - name: Check CMake Version
        run: cmake --version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Both Keystores
        run: |
          echo "${{ secrets.OLD_SIGNING_KEY_BASE64 }}" | base64 --decode > app/old_key.jks
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > app/new_full_ec_key.jks
          echo "${{ secrets.LINEAGE_BASE64 }}" | base64 --decode > app/app_lineage.bin

      - name: Build Debug, Release and Bundle
        run: ./gradlew :app:lint :app:assembleDebug :app:assembleRelease :app:bundleDebug :app:bundleRelease -i -w --stacktrace --warning-mode all 2>&1 | tee build.log
        env:
          OLD_STORE_PASSWORD: ${{ secrets.OLD_KEY_STORE_PASSWORD }}
          OLD_KEY_ALIAS: ${{ secrets.OLD_KEY_ALIAS }}
          OLD_KEY_PASSWORD: ${{ secrets.OLD_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          
      - name: Upload Build Log
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          archive: false
          
      - name: Upload Lint Report HTML
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-html
          path: app/build/reports/lint-results-debug.html
          archive: false
          
      - name: Upload Lint Report
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/*
          archive: true
        
      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*
          archive: true

      - name: Upload Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*
          archive: true
          
      - name: Upload Native Debug Symbols
        uses: actions/upload-artifact@v7
        with:
          name: native-debug-symbols
          path: app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          archive: false
          
      - name: Upload Debug Manifest
        uses: actions/upload-artifact@v7
        with:
          name: manifest-debug
          path: app/build/outputs/logs/manifest-merger-debug-report.txt
          archive: false
          
      - name: Upload Release Manifest
        uses: actions/upload-artifact@v7
        with:
          name: manifest-release
          path: app/build/outputs/logs/manifest-merger-release-report.txt
          archive: false
         
      - name: Upload R8
        uses: actions/upload-artifact@v7
        with:
          name: r8-deploy
          path: app/build/outputs/mapping/release/*
          archive: true
          
      - name: Upload R8 HTML
        uses: actions/upload-artifact@v7
        with:
          name: r8-html
          path: app/build/outputs/mapping/release/configanalyzer.html
          archive: false
      
      - name: Upload Debug Bundle
        uses: actions/upload-artifact@v7
        with:
          name: aab-bundle-debug
          path: app/build/outputs/bundle/debug/app-debug.aab
          archive: false
          
      - name: Upload Release Bundle
        uses: actions/upload-artifact@v7
        with:
          name: aab-bundle-release
          path: app/build/outputs/bundle/release/app-release.aab
          archive: false
          
      - name: Builds APKs Splits
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          OLD_KEY_STORE_PASSWORD: ${{ secrets.OLD_KEY_STORE_PASSWORD }}
          OLD_KEY_ALIAS: ${{ secrets.OLD_KEY_ALIAS }}
          OLD_KEY_PASSWORD: ${{ secrets.OLD_KEY_PASSWORD }}
        run: |
          chmod +x .github/scripts/build_and_sign.sh
          ./.github/scripts/build_and_sign.sh
          
      - name: Upload Debug Bundle Apks
        uses: actions/upload-artifact@v7
        with:
          name: apks-bundle-debug
          path: app/build/outputs/bundle/debug/aab-debug.apks
          archive: false
          
      - name: Upload Release Bundle Apks
        uses: actions/upload-artifact@v7
        with:
          name: apks-bundle-release
          path: app/build/outputs/bundle/release/aab-release.apks
          archive: false